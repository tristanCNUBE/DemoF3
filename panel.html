<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3 Leasing — Panel de Solicitudes</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-dk: #121D33;
    --steel: #33495E;
    --gold: #B08D57;
    --gold-lt: #D8C39A;
    --light: #F4F1EC;
    --cream: #FAF8F4;
    --gray: #6B6B6B;
    --line: #E8E6E0;
    --green: #3E7D4C;
    --amber: #B08D2B;
    --red: #B0463B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
    background: var(--cream);
    color: #222;
  }

  /* ---------- PIN gate ---------- */
  #pinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dk) 100%);
  }
  #pinScreen .card {
    background: var(--navy);
    border: 1px solid rgba(216,195,154,0.25);
    border-radius: 14px;
    padding: 44px 40px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  #pinScreen .eyebrow {
    color: var(--gold-lt);
    letter-spacing: 3px;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #pinScreen h1 {
    color: #fff;
    font-size: 22px;
    margin: 0 0 24px;
  }
  #pinScreen input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 18px;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 16px;
  }
  #pinScreen input:focus { outline: 1px solid var(--gold); }
  #pinScreen button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--gold);
    color: var(--navy-dk);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  #pinScreen button:hover { background: var(--gold-lt); }
  #pinError { color: #e39c92; font-size: 13px; margin-top: 12px; min-height: 16px; }

  /* ---------- Main panel ---------- */
  #panel { display: none; }
  header.top {
    background: var(--navy);
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.top .brand { color: #fff; }
  header.top .eyebrow {
    color: var(--gold-lt);
    letter-spacing: 3px;
    font-size: 11px;
    text-transform: uppercase;
  }
  header.top h1 { margin: 2px 0 0; font-size: 20px; font-weight: 700; }
  header.top button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-lt);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header.top button:hover { background: rgba(176,141,87,0.15); }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .toolbar .count { color: var(--gray); font-size: 14px; }
  .toolbar button {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  .card-credito {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .credito-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    cursor: pointer;
    background: var(--navy);
  }
  .credito-head:hover { background: var(--navy-dk); }
  .credito-head .who { display: flex; flex-direction: column; gap: 3px; }
  .credito-head .folio { font-size: 11px; color: var(--gold-lt); letter-spacing: 1px; text-transform: uppercase; }
  .credito-head .vehiculo { font-weight: 700; font-size: 16px; color: #fff; }
  .credito-head .meta { font-size: 12.5px; color: rgba(255,255,255,0.65); }
  .credito-count { font-size: 12px; color: var(--gold-lt); background: rgba(255,255,255,0.08); padding: 4px 12px; border-radius: 20px; white-space: nowrap; }

  .credito-body { display: none; padding: 18px 22px; }
  .credito-body.open { display: block; }

  .persona-block {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 14px;
    background: var(--cream);
  }
  .persona-block:last-child { margin-bottom: 0; }
  .persona-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .persona-head .who { display: flex; flex-direction: column; gap: 2px; }
  .persona-head .rol { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gold); font-weight: 700; }
  .persona-head .nombre { font-weight: 700; font-size: 14.5px; color: var(--navy); }
  .persona-head .meta { font-size: 12px; color: var(--gray); }

  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.iniciado, .badge.fase1_en_curso { background: #EDEBE6; color: var(--gray); }
  .badge.fase1_completa, .badge.docs_basicos { background: #F3E7CE; color: var(--amber); }
  .badge.listo_revision { background: #E1EFE4; color: var(--green); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin: 14px 0;
  }
  .field .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 3px; }
  .field .value { font-size: 13.5px; color: #222; }
  .field .value.empty { color: #bbb; font-style: italic; }

  .docs { margin-top: 10px; }
  .docs h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 8px; }
  .doc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .conf-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    color: #fff;
  }
  .conf-high { background: var(--green); }
  .conf-mid { background: var(--amber); }
  .conf-low { background: var(--red); }

  .empty-state { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 14px; }
  .loading { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 14px; }

  .checklist { margin: 14px 0; }
  .checklist h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 8px; }
  .check-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13.5px;
  }
  .check-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .check-icon.done { background: var(--green); color: #fff; }
  .check-icon.pending { background: #EDEBE6; color: var(--gray); }
  .check-label.done { color: #222; }
  .check-label.pending { color: var(--gray); }
  a.check-row-link { text-decoration: none; cursor: pointer; border-radius: 6px; margin: 0 -6px; padding: 6px; }
  a.check-row-link:hover { background: #fff; }
  a.check-row-link:hover .check-label { text-decoration: underline; }
</style>
</head>
<body>

<div id="pinScreen">
  <div class="card">
    <div class="eyebrow">F3 Leasing</div>
    <h1>Panel de solicitudes</h1>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button onclick="checkPin()">Entrar</button>
    <div id="pinError"></div>
  </div>
</div>

<div id="panel">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">F3 Leasing</div>
      <h1>Créditos en proceso</h1>
    </div>
    <button onclick="cargarDatos()">Actualizar</button>
  </header>
  <main>
    <div class="toolbar">
      <div class="count" id="countLabel"></div>
    </div>
    <div id="listado"></div>
  </main>
</div>

<script>
  // ---------- Configuración (rellenar antes de publicar) ----------
  const SUPABASE_URL = 'https://bfyrxykuaqxvbqtjojoe.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmeXJ4eWt1YXF4dmJxdGpvam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODEyNTYsImV4cCI6MjA5NDM1NzI1Nn0.-qF-Cqzj2nvlkaKDzDlGQcmj2L-OGbcrsCDNAlP_sxI';
  const PANEL_PIN = '4507'; // cámbialo si quieres otro PIN

  // ---------- PIN gate ----------
  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === PANEL_PIN) {
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      cargarDatos();
    } else {
      document.getElementById('pinError').textContent = 'PIN incorrecto';
    }
  }
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPin();
  });

  const ESTATUS_LABEL = {
    iniciado: 'Iniciado',
    fase1_en_curso: 'Fase 1 en curso',
    fase1_completa: 'Fase 1 completa',
    docs_basicos: 'Documentos básicos',
    listo_revision: 'Listo para revisión',
  };

  function fieldHtml(label, value) {
    const v = value ? value : null;
    return `<div class="field"><div class="label">${label}</div><div class="value ${v ? '' : 'empty'}">${v ? escapeHtml(v) : 'Sin datos aún'}</div></div>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function confClass(c) {
    if (c === null || c === undefined) return 'conf-mid';
    if (c >= 0.8) return 'conf-high';
    if (c >= 0.5) return 'conf-mid';
    return 'conf-low';
  }

  async function cargarDatos() {
    const listado = document.getElementById('listado');
    listado.innerHTML = '<div class="loading">Cargando créditos…</div>';
    try {
      const headers = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      };
      const [cotRes, solRes, docRes, accRes, refRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/f3_cotizaciones?select=*`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/f3_solicitudes?select=*&order=created_at.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/f3_documentos?select=*&order=created_at.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/f3_accionistas?select=*`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/f3_referencias_comerciales?select=*`, { headers }),
      ]);
      const cotizaciones = await cotRes.json();
      const solicitudes = await solRes.json();
      const documentos = await docRes.json();
      const accionistas = await accRes.json();
      const referencias = await refRes.json();

      if (!Array.isArray(solicitudes) || solicitudes.length === 0) {
        document.getElementById('countLabel').textContent = '0 créditos';
        listado.innerHTML = '<div class="empty-state">Aún no hay solicitudes capturadas.</div>';
        return;
      }

      // Agrupar solicitudes por folio de cotización
      const grupos = {};
      solicitudes.forEach(s => {
        const key = s.cotizacion_folio || '__sin_folio__';
        if (!grupos[key]) grupos[key] = [];
        grupos[key].push(s);
      });

      const folios = Object.keys(grupos);
      document.getElementById('countLabel').textContent =
        `${folios.length} crédito${folios.length === 1 ? '' : 's'} · ${solicitudes.length} persona${solicitudes.length === 1 ? '' : 's'} registrada${solicitudes.length === 1 ? '' : 's'}`;

      listado.innerHTML = folios.map((folio, gi) => {
        const cot = cotizaciones.find(c => c.folio === folio);
        const personas = grupos[folio];

        const personasHtml = personas.map(s => {
          const docs = documentos.filter(d => d.solicitud_id === s.id);
          const misAccionistas = accionistas.filter(a => a.solicitud_id === s.id);
          const misReferencias = referencias.filter(r => r.solicitud_id === s.id);
          const nombre = s.nombre_razon_social || s.telefono;
          const estatusKey = s.estatus || 'iniciado';
          const estatusLabel = ESTATUS_LABEL[estatusKey] || estatusKey;

          const checklistItems = [
            { label: 'Identificación oficial', done: docs.some(d => d.tipo_documento === 'identificacion') },
            { label: 'Constancia de Situación Fiscal', done: docs.some(d => d.tipo_documento === 'csf') },
            { label: 'Referencias comerciales', done: misReferencias.length > 0, href: `complementario.html?solicitud_id=${s.id}` },
            { label: 'Cuadro accionario', done: misAccionistas.length > 0, href: `complementario.html?solicitud_id=${s.id}` },
            { label: 'Representante legal', done: !!s.representante_legal, href: `complementario.html?solicitud_id=${s.id}` },
            { label: 'Acta constitutiva', done: !!s.acta_constitutiva, href: `f3_acta_constitutiva.html?solicitud_id=${s.id}` },
          ];
          const checklistHtml = checklistItems.map(item => {
            const row = `
              <span class="check-icon ${item.done ? 'done' : 'pending'}">${item.done ? '✓' : ''}</span>
              <span class="check-label ${item.done ? 'done' : 'pending'}">${item.label}</span>
            `;
            return item.href
              ? `<a class="check-row check-row-link" href="${item.href}" target="_blank">${row}</a>`
              : `<div class="check-row">${row}</div>`;
          }).join('');

          return `
          <div class="persona-block">
            <div class="persona-head">
              <div class="who">
                <div class="rol">${s.rol || 'Rol sin definir'}</div>
                <div class="nombre">${escapeHtml(nombre)}</div>
                <div class="meta">${escapeHtml(s.telefono)} · ${s.tipo_persona || '—'}</div>
              </div>
              <span class="badge ${estatusKey}">${estatusLabel}</span>
            </div>
            <div class="grid">
              ${fieldHtml('RFC', s.rfc)}
              ${fieldHtml('CURP', s.curp)}
              ${fieldHtml('Régimen fiscal', s.regimen_fiscal)}
              ${fieldHtml('Domicilio fiscal', s.domicilio_fiscal)}
              ${fieldHtml('Creado', s.created_at ? new Date(s.created_at).toLocaleString('es-MX') : null)}
            </div>
            <div class="checklist">
              <h4>Checklist del expediente</h4>
              ${checklistHtml}
            </div>
            <div class="docs">
              <h4>Documentos recibidos</h4>
              ${docs.length === 0 ? '<div class="value empty">Ninguno todavía</div>' : docs.map(d => `
                <div class="doc-row">
                  <span>${d.tipo_documento === 'identificacion' ? 'Identificación oficial' : 'Constancia de Situación Fiscal'}</span>
                  <span class="conf-pill ${confClass(d.confianza)}">${d.confianza != null ? Math.round(d.confianza * 100) + '% confianza' : 'sin score'}</span>
                </div>
              `).join('')}
            </div>
          </div>`;
        }).join('');

        const folioLabel = cot ? cot.folio : 'Sin folio de cotización';
        const vehiculoLabel = cot ? cot.vehiculo : 'Cotización no encontrada';
        const metaParts = [];
        if (cot?.monto_mensual) metaParts.push(`$${Number(cot.monto_mensual).toLocaleString('es-MX')} MXN/mes`);
        if (cot?.plazo_meses) metaParts.push(`${cot.plazo_meses} meses`);
        if (cot?.vendedor) metaParts.push(`Vendedor: ${cot.vendedor}`);

        return `
        <div class="card-credito">
          <div class="credito-head" onclick="toggleCredito(${gi})">
            <div class="who">
              <div class="folio">${escapeHtml(folioLabel)}</div>
              <div class="vehiculo">${escapeHtml(vehiculoLabel)}</div>
              <div class="meta">${metaParts.map(escapeHtml).join(' · ')}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <a href="solicitud.html?folio=${encodeURIComponent(folio)}" target="_blank" onclick="event.stopPropagation()" style="font-size:12px; color:var(--gold-lt); text-decoration:none; border:1px solid var(--gold); padding:6px 12px; border-radius:20px;">Ver solicitud</a>
              <a href="expediente.html?folio=${encodeURIComponent(folio)}" target="_blank" onclick="event.stopPropagation()" style="font-size:12px; color:var(--gold-lt); text-decoration:none; border:1px solid var(--gold); padding:6px 12px; border-radius:20px;">Ver expediente</a>
              <span class="credito-count">${personas.length} persona${personas.length === 1 ? '' : 's'}</span>
            </div>
          </div>
          <div class="credito-body" id="credito-${gi}">
            ${personasHtml}
          </div>
        </div>`;
      }).join('');
    } catch (err) {
      listado.innerHTML = `<div class="empty-state">No se pudo cargar la información. Verifica la URL y la clave de Supabase.<br><small>${escapeHtml(err.message || err)}</small></div>`;
    }
  }

  function toggleCredito(i) {
    document.getElementById(`credito-${i}`).classList.toggle('open');
  }
</script>
</body>
</html>
