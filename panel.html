<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3 Leasing — Panel de Solicitudes</title>
<style>
  :root {
    --navy: #1B2A4A;
    --navy-dk: #121D33;
    --steel: #33495E;
    --gold: #B08D57;
    --gold-lt: #D8C39A;
    --light: #F4F1EC;
    --cream: #FAF8F4;
    --gray: #6B6B6B;
    --line: #E8E6E0;
    --green: #3E7D4C;
    --amber: #B08D2B;
    --red: #B0463B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
    background: var(--cream);
    color: #222;
  }

  /* ---------- PIN gate ---------- */
  #pinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dk) 100%);
  }
  #pinScreen .card {
    background: var(--navy);
    border: 1px solid rgba(216,195,154,0.25);
    border-radius: 14px;
    padding: 44px 40px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  #pinScreen .eyebrow {
    color: var(--gold-lt);
    letter-spacing: 3px;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #pinScreen h1 {
    color: #fff;
    font-size: 22px;
    margin: 0 0 24px;
  }
  #pinScreen input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 18px;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 16px;
  }
  #pinScreen input:focus { outline: 1px solid var(--gold); }
  #pinScreen button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--gold);
    color: var(--navy-dk);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  #pinScreen button:hover { background: var(--gold-lt); }
  #pinError { color: #e39c92; font-size: 13px; margin-top: 12px; min-height: 16px; }

  /* ---------- Main panel ---------- */
  #panel { display: none; }
  header.top {
    background: var(--navy);
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.top .brand { color: #fff; }
  header.top .eyebrow {
    color: var(--gold-lt);
    letter-spacing: 3px;
    font-size: 11px;
    text-transform: uppercase;
  }
  header.top h1 { margin: 2px 0 0; font-size: 20px; font-weight: 700; }
  header.top button {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-lt);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header.top button:hover { background: rgba(176,141,87,0.15); }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .toolbar .count { color: var(--gray); font-size: 14px; }
  .toolbar button {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  .card-solicitud {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
  }
  .card-head:hover { background: var(--light); }
  .card-head .who { display: flex; flex-direction: column; gap: 3px; }
  .card-head .nombre { font-weight: 700; font-size: 15px; color: var(--navy); }
  .card-head .meta { font-size: 12.5px; color: var(--gray); }
  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.iniciado, .badge.fase1_en_curso { background: #EDEBE6; color: var(--gray); }
  .badge.fase1_completa, .badge.docs_basicos { background: #F3E7CE; color: var(--amber); }
  .badge.listo_revision { background: #E1EFE4; color: var(--green); }

  .card-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--line); }
  .card-body.open { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin: 16px 0;
  }
  .field .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 3px; }
  .field .value { font-size: 14px; color: #222; }
  .field .value.empty { color: #bbb; font-style: italic; }

  .docs { margin-top: 10px; }
  .docs h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 8px; }
  .doc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--light);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .conf-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    color: #fff;
  }
  .conf-high { background: var(--green); }
  .conf-mid { background: var(--amber); }
  .conf-low { background: var(--red); }

  .empty-state { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 14px; }
  .loading { text-align: center; color: var(--gray); padding: 60px 20px; font-size: 14px; }

  .actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .actions a {
    flex: 1; text-align: center; text-decoration: none; font-size: 12.5px; font-weight: 600;
    padding: 9px 10px; border-radius: 6px; border: 1px solid var(--navy); color: var(--navy);
    background: #fff; transition: background 0.15s;
  }
  .actions a:hover { background: var(--light); }
</style>
</head>
<body>

<div id="pinScreen">
  <div class="card">
    <div class="eyebrow">F3 Leasing</div>
    <h1>Panel de solicitudes</h1>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button onclick="checkPin()">Entrar</button>
    <div id="pinError"></div>
  </div>
</div>

<div id="panel">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">F3 Leasing</div>
      <h1>Solicitudes de arrendamiento</h1>
    </div>
    <button onclick="cargarDatos()">Actualizar</button>
  </header>
  <main>
    <div class="toolbar">
      <div class="count" id="countLabel"></div>
    </div>
    <div id="listado"></div>
  </main>
</div>

<script>
  // ---------- Configuración (rellenar antes de publicar) ----------
  const SUPABASE_URL = 'https://bfyrxykuaqxvbqtjojoe.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmeXJ4eWt1YXF4dmJxdGpvam9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODEyNTYsImV4cCI6MjA5NDM1NzI1Nn0.-qF-Cqzj2nvlkaKDzDlGQcmj2L-OGbcrsCDNAlP_sxI';
  const PANEL_PIN = '4507'; // cámbialo si quieres otro PIN

  // ---------- PIN gate ----------
  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === PANEL_PIN) {
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      cargarDatos();
    } else {
      document.getElementById('pinError').textContent = 'PIN incorrecto';
    }
  }
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPin();
  });

  const ESTATUS_LABEL = {
    iniciado: 'Iniciado',
    fase1_en_curso: 'Fase 1 en curso',
    fase1_completa: 'Fase 1 completa',
    docs_basicos: 'Documentos básicos',
    listo_revision: 'Listo para revisión',
  };

  function fieldHtml(label, value) {
    const v = value ? value : null;
    return `<div class="field"><div class="label">${label}</div><div class="value ${v ? '' : 'empty'}">${v ? escapeHtml(v) : 'Sin datos aún'}</div></div>`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function confClass(c) {
    if (c === null || c === undefined) return 'conf-mid';
    if (c >= 0.8) return 'conf-high';
    if (c >= 0.5) return 'conf-mid';
    return 'conf-low';
  }

  async function cargarDatos() {
    const listado = document.getElementById('listado');
    listado.innerHTML = '<div class="loading">Cargando solicitudes…</div>';
    try {
      const headers = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      };
      const [solRes, docRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/f3_solicitudes?select=*&order=created_at.desc`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/f3_documentos?select=*&order=created_at.desc`, { headers }),
      ]);
      const solicitudes = await solRes.json();
      const documentos = await docRes.json();

      document.getElementById('countLabel').textContent =
        `${solicitudes.length} solicitud${solicitudes.length === 1 ? '' : 'es'}`;

      if (!Array.isArray(solicitudes) || solicitudes.length === 0) {
        listado.innerHTML = '<div class="empty-state">Aún no hay solicitudes capturadas.</div>';
        return;
      }

      listado.innerHTML = solicitudes.map((s, i) => {
        const docs = documentos.filter(d => d.solicitud_id === s.id);
        const nombre = s.nombre_razon_social || s.telefono;
        const estatusKey = s.estatus || 'iniciado';
        const estatusLabel = ESTATUS_LABEL[estatusKey] || estatusKey;

        return `
        <div class="card-solicitud">
          <div class="card-head" onclick="toggleCard(${i})">
            <div class="who">
              <div class="nombre">${escapeHtml(nombre)}</div>
              <div class="meta">${escapeHtml(s.telefono)} · ${s.tipo_persona || '—'} · ${s.rol || '—'}</div>
            </div>
            <span class="badge ${estatusKey}">${estatusLabel}</span>
          </div>
          <div class="card-body" id="body-${i}">
            <div class="grid">
              ${fieldHtml('Régimen solicitado', s.regimen_solicitado)}
              ${fieldHtml('RFC', s.rfc)}
              ${fieldHtml('CURP', s.curp)}
              ${fieldHtml('Régimen fiscal', s.regimen_fiscal)}
              ${fieldHtml('Domicilio fiscal', s.domicilio_fiscal)}
              ${fieldHtml('Creado', s.created_at ? new Date(s.created_at).toLocaleString('es-MX') : null)}
            </div>
            <div class="docs">
              <h4>Documentos recibidos</h4>
              ${docs.length === 0 ? '<div class="value empty">Ninguno todavía</div>' : docs.map(d => `
                <div class="doc-row">
                  <span>${d.tipo_documento === 'identificacion' ? 'Identificación oficial' : 'Constancia de Situación Fiscal'}</span>
                  <span class="conf-pill ${confClass(d.confianza)}">${d.confianza != null ? Math.round(d.confianza * 100) + '% confianza' : 'sin score'}</span>
                </div>
              `).join('')}
            </div>
            <div class="actions">
              <a href="complementario.html?solicitud_id=${s.id}" target="_blank">Formulario complementario</a>
              <a href="f3_acta_constitutiva.html?solicitud_id=${s.id}" target="_blank">Acta constitutiva</a>
            </div>
          </div>
        </div>`;
      }).join('');
    } catch (err) {
      listado.innerHTML = `<div class="empty-state">No se pudo cargar la información. Verifica la URL y la clave de Supabase.<br><small>${escapeHtml(err.message || err)}</small></div>`;
    }
  }

  function toggleCard(i) {
    document.getElementById(`body-${i}`).classList.toggle('open');
  }
</script>
</body>
</html>
